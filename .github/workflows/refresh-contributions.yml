name: refresh-github-contributions

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh contributions data
        env:
          GITHUB_TOKEN: ${{ secrets.GH_CONTRIB_TOKEN }}
        run: node scripts/refresh-contributions.mjs

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/github.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore(data): refresh GitHub contributions'
            git push
          fi
