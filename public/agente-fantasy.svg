<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Agente Fantasy: panel local para LALIGA Fantasy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.55" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#f4e51c" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#7cf9ff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#7cf9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7cf9ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4e51c"/>
      <stop offset="1" stop-color="#7cf9ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#grid)"/>
  <rect width="800" height="420" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- Terminal bar -->
    <rect x="0" y="0" width="800" height="34" fill="#070d1a" fill-opacity="0.9"/>
    <line x1="0" y1="34" x2="800" y2="34" stroke="#7cf9ff" stroke-opacity="0.16"/>
    <circle cx="22" cy="17" r="4" fill="#ff5f57"/>
    <circle cx="37" cy="17" r="4" fill="#febc2e"/>
    <circle cx="52" cy="17" r="4" fill="#28c840"/>
    <text x="72" y="21" font-size="11" fill="#8fa3c8">agente-fantasy@local:~$ fantasy-advisor web</text>
    <text x="778" y="21" font-size="9" fill="#34d399" text-anchor="end">● LOCAL</text>

    <!-- Left: identity -->
    <text x="48" y="96" font-size="11" fill="#f4e51c" letter-spacing="3">// PROJECT_</text>
    <text x="48" y="150" font-size="42" font-weight="700" fill="#f2f7ff" letter-spacing="-1">AGENTE FANTASY</text>
    <text x="48" y="180" font-size="14" fill="#9db2d6">Asesor local para LALIGA Fantasy</text>
    <text x="48" y="201" font-size="12" fill="#6f86ad">Plantilla · mercado · rivales · referencias</text>

    <rect x="48" y="222" width="150" height="26" rx="6" fill="#f4e51c" fill-opacity="0.1" stroke="#f4e51c" stroke-opacity="0.4"/>
    <text x="123" y="239" font-size="11" fill="#f8f0a0" text-anchor="middle">Python 3.11</text>

    <rect x="206" y="222" width="96" height="26" rx="6" fill="#7cf9ff" fill-opacity="0.08" stroke="#7cf9ff" stroke-opacity="0.3"/>
    <text x="254" y="239" font-size="11" fill="#c8fbff" text-anchor="middle">SQLite</text>

    <rect x="310" y="222" width="152" height="26" rx="6" fill="#7cf9ff" fill-opacity="0.08" stroke="#7cf9ff" stroke-opacity="0.3"/>
    <text x="386" y="239" font-size="11" fill="#c8fbff" text-anchor="middle">OpenRouter · opt.</text>

    <text x="48" y="300" font-size="10" fill="#6f86ad">Sin pujas ni cambios en el juego</text>
    <text x="48" y="316" font-size="10" fill="#6f86ad">Recomendaciones explicables</text>

    <!-- Right: explainable panel -->
    <g transform="translate(492 78)">
      <rect x="0" y="0" width="264" height="264" rx="12" fill="#080f1e" fill-opacity="0.92" stroke="#7cf9ff" stroke-opacity="0.18"/>
      <rect x="0" y="0" width="264" height="34" rx="12" fill="#0b1526"/>
      <rect x="0" y="20" width="264" height="14" fill="#0b1526"/>
      <line x1="0" y1="34" x2="264" y2="34" stroke="#7cf9ff" stroke-opacity="0.14"/>
      <text x="16" y="22" font-size="10" fill="#8fa3c8">recomendacion.explicable</text>

      <g font-size="11">
        <text x="16" y="66" fill="#7cf9ff">01</text>
        <text x="40" y="66" fill="#e6f1ff">Plantilla y necesidades</text>
        <text x="16" y="100" fill="#7cf9ff">02</text>
        <text x="40" y="100" fill="#e6f1ff">Mercado y tendencias</text>
        <text x="16" y="134" fill="#7cf9ff">03</text>
        <text x="40" y="134" fill="#e6f1ff">Rivales y cláusulas</text>
        <text x="16" y="168" fill="#7cf9ff">04</text>
        <text x="40" y="168" fill="#e6f1ff">Historial local</text>
      </g>

      <line x1="16" y1="190" x2="248" y2="190" stroke="#7cf9ff" stroke-opacity="0.12"/>

      <rect x="16" y="206" width="232" height="40" rx="7" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.24"/>
      <text x="28" y="223" font-size="9" fill="#34d399">MODO</text>
      <text x="28" y="237" font-size="11" fill="#c9f5e4">solo lectura · datos locales</text>
    </g>

    <!-- Bottom accent -->
    <rect x="0" y="412" width="800" height="8" fill="url(#accent)" opacity="0.55"/>
    <text x="48" y="398" font-size="9" fill="#5f7599">tavoidkk / agente-fantasy</text>
  </g>
</svg>
